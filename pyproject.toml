[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ilmar"
description = "Provider-independent autonomous software factory."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Ilmar Authors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
# The core has no runtime dependencies (ADR-0003). Adapters that need
# third-party libraries must declare them as optional extras.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ilmar = "ilmar.cli:main"

[project.urls]
Repository = "https://github.com/Obtuse8053/Ilmar"

[tool.setuptools.dynamic]
version = { attr = "ilmar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ilmar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not integration"]
markers = [
    "integration: needs real external services or credentials; opt in with `pytest -m integration`",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "PIE", "RET", "TID",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts; fake credentials; container paths

[tool.ruff.lint.isort]
known-first-party = ["ilmar"]
known-local-folder = ["claude_code_support", "contracts", "fake_github", "fake_podman", "fakes", "git_support", "helpers", "integration", "license_inventory"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests", "scripts"]
files = ["src", "tests", "scripts"]
warn_unreachable = true
explicit_package_bases = true

