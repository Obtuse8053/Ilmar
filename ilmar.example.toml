# Example Ilmar configuration. Copy to `ilmar.toml` and adjust.
#
# Each port is configured independently: `kind` selects the adapter and
# `options` holds adapter-specific settings. Secrets are never written here;
# options ending in `_env` name the environment variable that holds them.
#
# `ilmar config validate` checks the structure, every adapter's options and
# the rules between ports (ADR-0019). It reads no secret; add
# `--check-environment` to check that the named variables are set.
#
# Keep this file outside the state directory's workspaces: verification
# policy must come from configuration nobody but the operator can change.

[ilmar]
state_dir = ".ilmar"
# Names this coordinator's resources (containers, claims). One instance per
# repository (ADR-0013).
instance_id = "default"

[limits]
max_attempts = 3
max_concurrent_executions = 1
agent_timeout_seconds = 3600
# #13, ADR-0035: end an agent run that shows no progress (no validated
# agent event) for this long; it is retried after backoff like other
# transient failures. Must not exceed agent_timeout_seconds, which stays the
# independent hard lifetime.
stall_timeout_seconds = 900
# #90, ADR-0029: the agent sandbox's hard lifetime. The container runtime
# (Podman's --timeout, enforced by conmon) stops the sandbox 60 seconds after
# this even if Ilmar itself is killed. At least agent_timeout_seconds; unset, it
# is agent_timeout_seconds + 600.
execution_wall_seconds = 4200
# #13, ADR-0028: after a transient failure the next attempt waits
# base * 2 ** (attempt - 1) seconds, at most the maximum. The wait is stored,
# so a restart never shortens it.
retry_backoff_base_seconds = 300
retry_backoff_max_seconds = 21600

[adapters.task_provider]
kind = "github"
# ADR-0013: claimed_label is owned by Ilmar (the only label it adds or removes).
# Human sessions claim with status:in-progress (docs/workflow.md), which Ilmar
# respects and never touches. Run exactly one Ilmar instance per repository:
# claims are detected, not locked.
# ADR-0026: only claim comments written by the token's own account count as
# Ilmar's. That account is read from GET /user; a GitHub App installation token
# cannot read it, so set bot_login = "<app-slug>[bot]" there. Without either,
# Ilmar fails closed: it neither releases nor cancels anything.
options = { repository = "Obtuse8053/Ilmar", eligible_label = "ilmar:ready", claimed_label = "ilmar:claimed", human_claim_labels = ["status:in-progress"], excluded_labels = ["needs:maintainer", "status:blocked", "proposal"], token_env = "GITHUB_TOKEN" }

[adapters.source_control]
kind = "github"
# ADR-0016: use a token with contents and pull-request write access and *no*
# workflow permission, so CI-configuration changes can never be pushed by Ilmar.
options = { repository = "Obtuse8053/Ilmar", base_branch = "main", token_env = "GITHUB_TOKEN" }

[adapters.container_runtime]
kind = "podman"
# ADR-0015: the egress proxy that lets agent sandboxes reach only their
# model endpoint. Settings that would weaken the sandbox (network, user,
# mounts, capabilities) are not configurable.
options = { proxy_image = "docker.io/library/python:3.12-alpine" }

[adapters.agent_runner]
kind = "claude-code"
# ADR-0017: the only secret in the agent sandbox; passed per command, never stored.
# Build the image from images/claude-code/Containerfile at a pinned version.
# The agent sandbox reaches only api.anthropic.com (or the host of base_url).
options = { image = "localhost/ilmar-claude-code:pinned", api_key_env = "ANTHROPIC_API_KEY" }

[adapters.execution_store]
kind = "sqlite"
options = { path = ".ilmar/executions.sqlite3" }

# ADR-0010, ADR-0018: what VERIFYING runs, in a fresh sandbox with no network and
# no credential. Defined here, never in the repository being changed. The
# built-in protected, check-influencing and CI-configuration paths always apply;
# the extra_* lists can only add to them.
[verification]
image = "localhost/ilmar-verify:pinned"
memory_mb = 4096
extra_protected_paths = ["docs/architecture/decisions/"]
# Safety controls (ADR-0031): a candidate touching one is never pushed and its
# task stays claimed and blocked for a maintainer. CI configuration,
# .gitattributes and .gitmodules are always protected. Set self_repository when
# the target is Ilmar's own repository to protect its safety-control code too.
# Additions only; nothing removes a built-in entry.
# self_repository = false
# extra_safety_controls = []

# Commands of one job share a checkout and sandbox; separate jobs are isolated.
[[verification.commands]]
name = "lint"
job = "static"
argv = ["ruff", "check", "."]
timeout_seconds = 300

[[verification.commands]]
name = "types"
job = "static"
argv = ["mypy"]
timeout_seconds = 600

[[verification.commands]]
name = "tests"
job = "tests"
argv = ["pytest", "-q"]
timeout_seconds = 1200


# Accounting reservations (#18, ADR-0029 §2). Optional in manual operation;
# every key is required once the section exists. Each attempt is charged
# reserve_per_execution_usd as it starts and starts only within the daily and
# monthly allowances (UTC). Reservations are accounting, not a cost limit: the
# provider's workspace spend limit is the hard limit, attested here. When an
# allowance is used up, Ilmar suspends new work (exit 78) until
# `ilmar resume --as <name>` finds room again; nothing is ever refunded.
#
# [budget]
# daily_usd = 20
# monthly_usd = 300
# reserve_per_execution_usd = 5
# provider_cap_attested_usd = 300
# While this file exists, Ilmar suspends with kill-switch (ADR-0029 §4). Keep it
# outside the state directory's workspaces and repositories.
# kill_switch_file = "/etc/ilmar/KILL"
