name: Gateway compatibility (manual, no secrets)

# ADR-0037's prerequisite (#111): does the pinned Claude Code complete a run
# through a plain-HTTP ANTHROPIC_BASE_URL, with a throwaway token? It runs
# tests/integration/test_claude_code_gateway_compat.py against a locally
# built agent image. The sandbox has no network; a stand-in API answers inside
# it. No secret, no environment and no real model call are involved, so this
# needs no reviewer gate beyond being started by hand on main.
#
# The record (issue-111-gateway-compat.json) is kept as an artifact for the
# maintainer to review. Nothing is posted and nothing is published. Unattended
# operation stays disabled.

on:
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Claude Code version to pin (x.y.z)"
        required: true
        type: string

permissions: {}

concurrency:
  group: gateway-compat
  cancel-in-progress: false

env:
  # Untrusted input: only ever expanded from the environment, never in `run:`.
  ILMAR_TEST_CLAUDE_VERSION: ${{ inputs.claude_version }}

jobs:
  compat:
    name: Pinned Claude Code through a plain-HTTP gateway
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check the version input
        run: printf '%s' "$ILMAR_TEST_CLAUDE_VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build the agent image at the pinned version (from the digest-pinned base)
        run: |
          podman version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman build --build-arg CLAUDE_CODE_VERSION="$ILMAR_TEST_CLAUDE_VERSION" \
            -t "localhost/ilmar-claude-code:$ILMAR_TEST_CLAUDE_VERSION" images/claude-code
      - name: Gateway compatibility test
        run: |
          export ILMAR_TEST_CLAUDE_IMAGE="localhost/ilmar-claude-code:$ILMAR_TEST_CLAUDE_VERSION"
          export ILMAR_LIVE_REQUIRED=1
          export ILMAR_LIVE_REPORT_DIR="$RUNNER_TEMP/gateway-reports"
          pytest -m integration -v -rs tests/integration/test_claude_code_gateway_compat.py
      - name: Remove every container
        if: always()
        run: podman rm --all --force --time 0 || true
      - name: Keep the record (no credentials; the throwaway token is checked out of it)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-compat-record
          path: ${{ runner.temp }}/gateway-reports/*.json
          if-no-files-found: ignore
          retention-days: 30
