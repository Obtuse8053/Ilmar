name: Anthropic workspace cap drill (one time, manual)

# No push, PR or scheduled trigger. Secrets only at approved manual steps.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Reviewed full SHA of main; must still be main"
        type: string
        required: true
      authorization:
        description: "URL of maintainer #93 comment naming SHA, ilmar-cap-test and $1.00"
        type: string
        required: true
      cap_cents:
        description: "Must be 100 (USD 1.00)"
        type: string
        required: true
        default: "100"
      disposable_issue:
        description: "Existing, trusted, unlabelled ilmar-disposable issue number"
        type: number
        required: true

permissions: {}

concurrency:
  group: one-time-cap-drill
  cancel-in-progress: false

env:
  ILMAR_EXPECTED_SHA: ${{ inputs.expected_sha }}
  ILMAR_CAP_AUTHORIZATION: ${{ inputs.authorization }}
  ILMAR_CAP_CENTS: ${{ inputs.cap_cents }}

jobs:
  guard:
    name: Review SHA and consume one-time authorization (no secrets)
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify manual authorization and once-only marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cap_drill.py guard
      - name: Record irreversible start on issue 93 before any paid call
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cap_drill.py mark

  drill:
    name: Actual cap refusal through real Ilmar (approved, secret-scoped)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: cap-drill
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install this reviewed commit, without credentials
        run: python -m pip install -e .
      - name: Build pinned Claude Code image and pull proxy (no credentials)
        run: |
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman pull docker.io/library/python:3.12-alpine
          podman build --build-arg CLAUDE_CODE_VERSION=2.1.318 \
            -t localhost/ilmar-claude-code:2.1.318 images/claude-code
      - name: Verify actual Anthropic cap, workspace and key binding (no paid messages)
        env:
          GH_TOKEN: ${{ github.token }}
          CAP_DRILL_ADMIN_READ: ${{ secrets.CAP_DRILL_ADMIN_READ }}
          CAP_DRILL_KEY: ${{ secrets.CAP_DRILL_KEY }}
        run: python3 scripts/cap_drill.py preflight
      - name: Sequential capped provider requests — no retries
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          CAP_DRILL_KEY: ${{ secrets.CAP_DRILL_KEY }}
        run: python3 scripts/cap_drill.py exhaust
      - name: Check real coordinator refusal, suspension and no retry
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          CAP_DRILL_KEY: ${{ secrets.CAP_DRILL_KEY }}
          CAP_DRILL_GITHUB_TOKEN: ${{ secrets.CAP_DRILL_GITHUB_TOKEN }}
          CAP_DRILL_ISSUE: ${{ inputs.disposable_issue }}
        run: python3 scripts/cap_drill.py through-ilmar --issue "$CAP_DRILL_ISSUE"
      - name: Read actual billed cost separately from estimates
        env:
          GH_TOKEN: ${{ github.token }}
          CAP_DRILL_ADMIN_READ: ${{ secrets.CAP_DRILL_ADMIN_READ }}
        run: python3 scripts/cap_drill.py reconcile
      - name: Stop and remove any remaining test containers
        if: always()
        run: |
          podman rm --all --force --time 0 || true
          podman network prune --force || true
      - name: Write allow-listed, credential-free evidence
        if: always()
        run: python3 scripts/cap_drill.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cap-drill-evidence
          path: ${{ runner.temp }}/cap-drill.json
          if-no-files-found: error
          retention-days: 30
