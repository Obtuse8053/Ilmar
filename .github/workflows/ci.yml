name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Validate example configuration
        run: ilmar config validate ilmar.example.toml

  podman:
    # Real rootless Podman: the ContainerRuntime contract and the ADR-0011
    # sandbox profile (#5). ILMAR_TEST_PODMAN_REQUIRED turns a skip into a failure.
    name: Podman sandbox (integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ILMAR_TEST_PODMAN_IMAGE: docker.io/library/alpine:3.20
      ILMAR_TEST_PODMAN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Podman environment
        run: |
          podman version
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}} runtime={{.Host.OCIRuntime.Name}} network={{.Host.NetworkBackend}}'
      - name: Pull the test image
        run: |
          podman pull "$ILMAR_TEST_PODMAN_IMAGE"
          podman image inspect --format 'digest={{.Digest}}' "$ILMAR_TEST_PODMAN_IMAGE"
      - name: Podman integration tests
        run: pytest -m integration tests/integration/test_podman_runtime.py -v -rs

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/python -m pip install -e ".[dev]"
      - name: License inventory
        run: /tmp/env/bin/python scripts/license_inventory.py
