name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Validate example configuration
        run: ilmar config validate ilmar.example.toml

  podman:
    # Real rootless Podman: the ContainerRuntime contract, the ADR-0011 sandbox
    # profile (#5) and the §9 network suite with the egress proxy (#40).
    # ILMAR_TEST_PODMAN_REQUIRED turns a skip into a failure.
    name: Podman sandbox (integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ILMAR_TEST_PODMAN_IMAGE: docker.io/library/alpine:3.20
      ILMAR_TEST_PODMAN_PROXY_IMAGE: docker.io/library/python:3.12-alpine
      ILMAR_TEST_PODMAN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Podman environment
        run: |
          podman version
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}} runtime={{.Host.OCIRuntime.Name}} network={{.Host.NetworkBackend}}'
      - name: Pull the test images
        run: |
          for image in "$ILMAR_TEST_PODMAN_IMAGE" "$ILMAR_TEST_PODMAN_PROXY_IMAGE"; do
            podman pull "$image"
            podman image inspect --format "$image digest={{.Digest}}" "$image"
          done
      - name: Live workflow inputs (hash-locked wheels, digest-pinned agent base image)
        # The manual live workflow installs exactly requirements/live.txt and builds
        # from the Containerfile's pinned base: prove both still resolve, the hashes
        # match, the set is complete (pip check) and live_ci.py unpacks it.
        run: |
          python -m pip download --require-hashes --no-deps --only-binary=:all: --no-cache-dir \
            --dest "$RUNNER_TEMP/live-wheels" --requirement requirements/live.txt
          python -m venv "$RUNNER_TEMP/lock-check"
          "$RUNNER_TEMP/lock-check/bin/python" -m pip install --no-index --no-deps --require-hashes \
            --find-links "$RUNNER_TEMP/live-wheels" --requirement requirements/live.txt
          "$RUNNER_TEMP/lock-check/bin/python" -m pip check
          python scripts/live_ci.py --install-wheels "$RUNNER_TEMP/live-wheels" "$RUNNER_TEMP/live-site"
          PYTHONPATH="$RUNNER_TEMP/live-site" PYTHONNOUSERSITE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            /usr/bin/python3 -c 'import os, pytest; assert pytest.__file__.startswith(os.environ["PYTHONPATH"]), pytest.__file__; print("pytest", pytest.__version__)'
          podman pull "$(sed -n 's/^FROM //p' images/claude-code/Containerfile)"
      - name: Let the tests bind self-hosted targets on ports 53, 80 and 443
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Podman integration tests
        run: >-
          pytest -m integration -v -rs
          tests/integration/test_podman_runtime.py
          tests/integration/test_podman_egress.py
          tests/integration/test_claude_code_podman.py
          tests/integration/test_verification_podman.py
          tests/integration/test_registry_podman.py
          tests/integration/test_coordinator_podman.py
          tests/integration/test_recovery_podman.py
          tests/integration/test_podman_credentials.py

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/python -m pip install -e ".[dev]"
      - name: License inventory
        run: /tmp/env/bin/python scripts/license_inventory.py
